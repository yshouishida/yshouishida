name: Generate Snake

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

  # Allow manual execution
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Allow the workflow to create/update the output branch
    permissions:
      contents: write

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Generate snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: yshouishida
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg

      # Push generated files to output branch
      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
